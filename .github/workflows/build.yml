name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-progress runs of the same workflow on the same ref —
# we only care about the latest commit per branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: pin apt versions — hard to do across base-image revs.
          # DL3013: pin pip versions — we DO pin; suppress only if linter
          #         can't parse the && chain. Re-enable on demand.
          ignore: DL3008
          failure-threshold: warning

  shellcheck:
    name: startup.sh lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC1091
        with:
          scandir: .
          severity: warning

  docker-build:
    name: docker build (same Dockerfile Railway runs)
    runs-on: ubuntu-latest
    needs: [hadolint, shellcheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          tags: kon-faber-agent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  python-syntax:
    name: mcp_servers python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile-check
        run: |
          python -m compileall -q mcp_servers/
      - name: Pyflakes (best-effort)
        run: |
          pip install pyflakes==3.4.0
          pyflakes mcp_servers/ || true
